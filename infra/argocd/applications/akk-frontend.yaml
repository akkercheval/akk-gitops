apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: akk-frontend
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/akkercheval/akk-gitops.git
    targetRevision: main
    path: apps/akk-frontend
  destination:
    server: https://kubernetes.default.svc
    namespace: akk-frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
