# Syncs the SealedSecrets that Argo CD Image Updater needs (GHCR read token and
# git write-back token) into the argocd namespace. The Sealed Secrets controller
# decrypts them into real Secrets named ghcr-creds and git-creds.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-updater-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/akkercheval/akk-gitops.git
    targetRevision: main
    path: secrets/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
