apiVersion: apps/v1
kind: Deployment
metadata:
  name: akk-frontend
  namespace: akk-frontend
  labels:
    app: akk-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akk-frontend
  template:
    metadata:
      labels:
        app: akk-frontend
    spec:
      containers:
        - name: akk-frontend
          image: ghcr.io/akkercheval/akk-frontend:latest   # Argo CD deploys new tags on push
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
