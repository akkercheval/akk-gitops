apiVersion: apps/v1
kind: Deployment
metadata:
  name: akk-frontend
  namespace: akk-frontend
  labels:
    app: akk-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akk-frontend
  template:
    metadata:
      labels:
        app: akk-frontend
    spec:
      containers:
        - name: akk-frontend
          # Immutable, build-specific tag. Argo CD Image Updater rewrites this
          # value in Git (see infra/argocd/applications/akk-frontend.yaml) each
          # time a newer sha-tagged build is pushed to GHCR, so the manifest
          # stays the source of truth and rollbacks are a one-line revert.
          image: ghcr.io/akkercheval/akk-frontend:sha-8eff172
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
