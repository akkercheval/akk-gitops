apiVersion: apps/v1
kind: Deployment
metadata:
  name: akk-frontend
  namespace: akk-frontend
  labels:
    app: akk-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: akk-frontend
  template:
    metadata:
      labels:
        app: akk-frontend
    spec:
      containers:
        - name: akk-frontend
          # NOTE: this literal tag is NOT the one that gets deployed and is NOT
          # kept up to date. The effective image comes from the images: override
          # in kustomization.yaml, which is the only place Argo CD Image Updater
          # rewrites on a new build (write-back-target "kustomization:." on the
          # Application; see infra/argocd/applications/akk-frontend.yaml).
          # Kustomize's images: transform wins over this value regardless, so
          # treat this as a readability hint only — it will drift from the
          # running tag. To see / change what is actually deployed, look at
          # apps/akk-frontend/kustomization.yaml.
          image: ghcr.io/akkercheval/akk-frontend:sha-8eff172
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
