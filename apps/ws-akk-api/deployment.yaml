apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-akk-api
  namespace: akk-api
  labels:
    app: ws-akk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-akk-api
  template:
    metadata:
      labels:
        app: ws-akk-api
    spec:
      containers:
        - name: ws-akk-api
          # NOTE: this literal tag is NOT the one that gets deployed and is NOT
          # kept up to date. The effective image comes from the images: override
          # in kustomization.yaml, the only place Argo CD Image Updater rewrites
          # on a new build (write-back-target "kustomization:." on the
          # Application; see infra/argocd/applications/ws-akk-api.yaml).
          # Kustomize's images: transform wins over this value regardless, so
          # treat this as a readability hint only — it will drift from the
          # running tag. To see / change what is actually deployed, look at
          # apps/ws-akk-api/kustomization.yaml.
          image: ghcr.io/akkercheval/ws-akk-api:sha-1cc826d
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Bind to 8080 inside the container (matches Service/Ingress).
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # ASP.NET Core maps "__" to nested config keys. These override the
            # values that would otherwise come from appsettings.json (which is
            # NOT shipped in the image). Key names must match Program.cs:
            #   ConnectionStrings:DefaultConnection, Jwt:Key, AdminUser:PasswordHash
            # All are pulled from the akk-app-secrets SealedSecret.
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: akk-app-secrets
                  key: connectionString
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: akk-app-secrets
                  key: jwtKey
            - name: AdminUser__PasswordHash
              valueFrom:
                secretKeyRef:
                  name: akk-app-secrets
                  key: adminPasswordHash
          readinessProbe:
            httpGet:
              path: /api/cookiecutters
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/cookiecutters
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
