apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-akk-api
  namespace: akk-api
  labels:
    app: ws-akk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-akk-api
  template:
    metadata:
      labels:
        app: ws-akk-api
    spec:
      containers:
        - name: ws-akk-api
          image: ghcr.io/akkercheval/ws-akk-api:latest   # Argo CD deploys new tags on push
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            # Bind to 8080 inside the container (matches Service/Ingress).
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # ASP.NET Core maps "__" to nested config keys. These override the
            # values that would otherwise come from appsettings.json (which is
            # NOT shipped in the image). Key names must match Program.cs:
            #   ConnectionStrings:DefaultConnection, Jwt:Key, AdminUser:PasswordHash
            # All are pulled from the akk-app-secrets SealedSecret.
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: akk-app-secrets
                  key: connectionString
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: akk-app-secrets
                  key: jwtKey
            - name: AdminUser__PasswordHash
              valueFrom:
                secretKeyRef:
                  name: akk-app-secrets
                  key: adminPasswordHash
          readinessProbe:
            httpGet:
              path: /api/cookiecutters
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/cookiecutters
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
